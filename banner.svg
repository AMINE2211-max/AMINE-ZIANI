<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none" role="img" aria-label="Amine Ziani — Red Team Operator">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0820"/>
      <stop offset="0.45" stop-color="#1a0b2e"/>
      <stop offset="0.8" stop-color="#2a0f3a"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e5ff"/>
      <stop offset="0.5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#ff5fae"/>
      <animate attributeName="x1" values="0;0.6;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="moong" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4e0"/>
      <stop offset="0.7" stop-color="#ffe3b0"/>
      <stop offset="1" stop-color="#ffcf80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1ea"/>
      <stop offset="1" stop-color="#ff5fae"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip"><rect x="64" y="176" width="0" height="34"><animate attributeName="width" values="0;0;540;540;0" keyTimes="0;0.07;0.55;0.92;1" dur="7.5s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- sky -->
  <rect width="900" height="320" rx="16" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dfe8ff">
    <circle cx="120" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="28" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="46" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="24" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="70" r="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="18" r="0.9"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="762" cy="86" r="78" fill="url(#moonhalo)"/>
  <circle cx="762" cy="86" r="46" fill="url(#moong)"/>
  <circle cx="748" cy="74" r="7" fill="#f0d8a8" opacity="0.6"/>
  <circle cx="776" cy="96" r="5" fill="#f0d8a8" opacity="0.5"/>
  <circle cx="770" cy="70" r="3.5" fill="#f0d8a8" opacity="0.5"/>

  <!-- katakana digital rain (faint) -->
  <g font-family="monospace" font-size="15" fill="#39f0b0">
    <g opacity="0"><animate attributeName="opacity" values="0;0.45;0" dur="5s" repeatCount="indefinite"/>
      <text x="300" y="0">ハ<tspan x="300" dy="18">ッ</tspan><tspan x="300" dy="18">カ</tspan><tspan x="300" dy="18">ー</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -30" to="0 340" dur="7s" repeatCount="indefinite"/></text></g>
    <g opacity="0" fill="#22e5ff"><animate attributeName="opacity" values="0;0.4;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      <text x="470" y="0">シ<tspan x="470" dy="18">ノ</tspan><tspan x="470" dy="18">ビ</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 360" dur="8.5s" begin="1.5s" repeatCount="indefinite"/></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0.4;0" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
      <text x="840" y="0">レ<tspan x="840" dy="18">ッ</tspan><tspan x="840" dy="18">ド</tspan><tspan x="840" dy="18">ム</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -30" to="0 340" dur="7.8s" begin="0.8s" repeatCount="indefinite"/></text></g>
  </g>

  <!-- city skyline -->
  <g fill="#0c0a1c">
    <rect x="0" y="244" width="64" height="76"/><rect x="60" y="226" width="54" height="94"/>
    <rect x="110" y="252" width="72" height="68"/><rect x="180" y="214" width="48" height="106"/>
    <rect x="225" y="238" width="66" height="82"/><rect x="290" y="222" width="56" height="98"/>
    <rect x="345" y="250" width="72" height="70"/><rect x="415" y="230" width="52" height="90"/>
    <rect x="525" y="244" width="58" height="76"/><rect x="655" y="248" width="52" height="72"/>
    <rect x="705" y="220" width="66" height="100"/><rect x="770" y="242" width="60" height="78"/>
    <rect x="830" y="232" width="72" height="88"/>
  </g>
  <!-- window lights -->
  <g fill="#ffcf6b">
    <rect x="76" y="236" width="4" height="5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="92" y="244" width="4" height="5"/><rect x="192" y="226" width="4" height="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="305" y="234" width="4" height="5"/><rect x="722" y="232" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="845" y="246" width="4" height="5"/><rect x="430" y="242" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#39f0ff" opacity="0.85">
    <rect x="200" y="244" width="4" height="5"/><rect x="740" y="250" width="4" height="5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="120" y="266" width="4" height="5"/><rect x="860" y="258" width="4" height="5"/>
  </g>

  <!-- neon torii gate -->
  <g filter="url(#redglow)" fill="#ff2e55">
    <rect x="452" y="150" width="140" height="12" rx="2"/>
    <path d="M446 150 q76 -14 152 0 l0 -8 q-76 -10 -152 0 Z"/>
    <rect x="470" y="172" width="104" height="8" rx="1.5"/>
    <rect x="486" y="150" width="11" height="104"/>
    <rect x="547" y="150" width="11" height="104"/>
    <rect x="516" y="162" width="12" height="12"/>
  </g>
  <g fill="#ff93a8" opacity="0.7">
    <rect x="488" y="150" width="3" height="104"/><rect x="549" y="150" width="3" height="104"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Verdana, sans-serif" font-weight="800" letter-spacing="2">
    <text x="62" y="128" font-size="58" fill="url(#title)" filter="url(#glow)">AMINE ZIANI
      <animate attributeName="opacity" values="1;1;0.82;1;1" keyTimes="0;0.45;0.5;0.55;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="66" y="156" font-family="monospace" font-size="13" fill="#ff93c4" letter-spacing="3">// OFFENSIVE SECURITY ENGINEER</text>

  <!-- typing subtitle -->
  <g clip-path="url(#typeClip)">
    <text x="64" y="200" font-family="monospace" font-size="18" fill="#dff7ff">&gt; penetration tester // red team operator</text>
  </g>
  <rect y="182" width="10" height="22" fill="#22e5ff">
    <animate attributeName="x" values="64;64;600;600;64" keyTimes="0;0.07;0.55;0.92;1" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- status chips -->
  <g font-family="monospace" font-size="12.5">
    <circle cx="70" cy="230" r="4" fill="#39f0b0"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="82" y="234" fill="#39f0b0">HTB OMNISCIENT</text>
    <text x="210" y="234" fill="#ffcf6b">#1 MOROCCO</text>
    <text x="318" y="234" fill="#22e5ff">TOP 10 GLOBAL</text>
    <text x="440" y="234" fill="#ff5fae">14 PRO LABS</text>
  </g>
  <rect x="64" y="244" height="2.5" rx="1" fill="url(#title)"><animate attributeName="width" values="0;440;440" keyTimes="0;0.6;1" dur="3s" fill="freeze"/></rect>

  <!-- sakura petals (front) -->
  <g>
    <g><animateTransform attributeName="transform" type="translate" values="120 -20;110 150;135 340" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/><path d="M0,0 C4,-5 5,-12 0,-17 C-5,-12 -4,-5 0,0 Z" fill="url(#petal)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="360 -30;380 160;355 350" keyTimes="0;0.5;1" dur="11s" begin="1s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/><path d="M0,0 C4,-5 5,-12 0,-17 C-5,-12 -4,-5 0,0 Z" fill="url(#petal)" opacity="0.9"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="610 -20;630 170;600 350" keyTimes="0;0.5;1" dur="10s" begin="2s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/><path d="M0,0 C4,-5 5,-12 0,-17 C-5,-12 -4,-5 0,0 Z" fill="url(#petal)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="820 -30;800 150;830 350" keyTimes="0;0.5;1" dur="12s" begin="0.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/><path d="M0,0 C4,-5 5,-12 0,-17 C-5,-12 -4,-5 0,0 Z" fill="url(#petal)" opacity="0.85"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="240 -40;255 150;225 350" keyTimes="0;0.5;1" dur="10.5s" begin="3s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/><path d="M0,0 C3,-4 4,-10 0,-14 C-4,-10 -3,-4 0,0 Z" fill="url(#petal)" opacity="0.8"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="710 -20;690 160;720 350" keyTimes="0;0.5;1" dur="9.5s" begin="2.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4.8s" repeatCount="indefinite"/><path d="M0,0 C3,-4 4,-10 0,-14 C-4,-10 -3,-4 0,0 Z" fill="url(#petal)" opacity="0.8"/></g></g>
  </g>

  <rect width="900" height="320" rx="16" fill="none" stroke="#2a1840" stroke-width="1.5"/>
</svg>
