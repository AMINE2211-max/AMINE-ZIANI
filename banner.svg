<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="280" viewBox="0 0 900 280" fill="none" role="img" aria-label="DarkHexXox — offensive security operator">
  <defs>
    <!-- gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#070a12"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e5ff"/>
      <stop offset="0.5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22e5ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>

    <!-- glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing reveal mask -->
    <clipPath id="typeClip">
      <rect x="70" y="150" width="0" height="40">
        <animate attributeName="width" values="0;0;560;560;0" keyTimes="0;0.06;0.55;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="280" rx="16" fill="url(#bg)"/>
  <rect width="900" height="280" rx="16" fill="none" stroke="#141a26" stroke-width="1.5"/>
  <ellipse cx="450" cy="120" rx="420" ry="150" fill="url(#glowc)"/>

  <!-- faint grid -->
  <g stroke="#0e1522" stroke-width="1">
    <line x1="0" y1="56" x2="900" y2="56"/><line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/><line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="150" y1="0" x2="150" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/><line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
  </g>

  <!-- matrix hex rain -->
  <g font-family="monospace" font-size="13" fill="#2bff88">
    <g opacity="0.0"><animate attributeName="opacity" values="0.0;0.5;0.0" dur="3s" repeatCount="indefinite"/>
      <text x="40" y="0">4F<tspan x="40" dy="18">A3</tspan><tspan x="40" dy="18">1C</tspan><tspan x="40" dy="18">7E</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 300" dur="6s" repeatCount="indefinite"/></text>
    </g>
    <g opacity="0.0"><animate attributeName="opacity" values="0.0;0.4;0.0" dur="4s" begin="1s" repeatCount="indefinite"/>
      <text x="820" y="0">0x<tspan x="820" dy="18">DE</tspan><tspan x="820" dy="18">AD</tspan><tspan x="820" dy="18">BE</tspan><tspan x="820" dy="18">EF</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -60" to="0 320" dur="7.5s" begin="1s" repeatCount="indefinite"/></text>
    </g>
    <g opacity="0.0" fill="#22e5ff"><animate attributeName="opacity" values="0.0;0.35;0.0" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      <text x="860" y="0">90<tspan x="860" dy="18">CC</tspan><tspan x="860" dy="18">31</tspan><tspan x="860" dy="18">37</tspan>
        <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 300" dur="8s" begin="0.5s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#22e5ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24 44 L24 24 L44 24"/>
    <path d="M876 44 L876 24 L856 24"/>
    <path d="M24 236 L24 256 L44 256"/>
    <path d="M876 236 L876 256 L856 256"/>
  </g>

  <!-- top status strip -->
  <g font-family="monospace" font-size="12">
    <circle cx="76" cy="50" r="4" fill="#2bff88"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="88" y="54" fill="#2bff88">SYSTEM ONLINE</text>
    <text x="712" y="54" fill="#6b8299">[ sec://operator/DarkHexXox ]</text>
  </g>

  <!-- title with RGB-split glitch -->
  <g font-family="'Segoe UI', Verdana, sans-serif" font-weight="800" font-size="62" letter-spacing="1">
    <text x="68" y="128" fill="#ff2bd6" opacity="0.55">DarkHexXox
      <animateTransform attributeName="transform" type="translate" values="0 0; -2.5 1; 1.5 -1; 0 0; 2 0; 0 0" keyTimes="0;0.02;0.04;0.06;0.5;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="68" y="128" fill="#22e5ff" opacity="0.55">DarkHexXox
      <animateTransform attributeName="transform" type="translate" values="0 0; 2.5 -1; -1.5 1; 0 0; -2 0; 0 0" keyTimes="0;0.02;0.04;0.06;0.5;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="68" y="128" fill="url(#title)" filter="url(#glow)">DarkHexXox</text>
  </g>

  <!-- typing tagline -->
  <g clip-path="url(#typeClip)">
    <text x="70" y="178" font-family="monospace" font-size="19" fill="#dff7ff">&gt; bug-bounty hunter · HTB machine pwner · CTF operator</text>
  </g>
  <!-- blinking cursor -->
  <rect y="162" width="11" height="22" fill="#22e5ff">
    <animate attributeName="x" values="70;70;632;632;70" keyTimes="0;0.06;0.55;0.92;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- discipline chips -->
  <g font-family="monospace" font-size="12.5" fill="#8b5cff">
    <text x="70" y="214">[ web ]</text>
    <text x="134" y="214" fill="#22e5ff">[ pwn ]</text>
    <text x="198" y="214" fill="#ff2bd6">[ recon ]</text>
    <text x="272" y="214" fill="#2bff88">[ rev ]</text>
    <text x="330" y="214" fill="#ffbf3f">[ authoring ]</text>
  </g>

  <!-- animated underline -->
  <rect x="68" y="228" height="2.5" fill="url(#title)" rx="1">
    <animate attributeName="width" values="0;470;470" keyTimes="0;0.6;1" dur="3s" fill="freeze"/>
  </rect>

  <!-- scanline sweep -->
  <rect x="2" width="896" height="46" fill="url(#scan)" opacity="0.6">
    <animate attributeName="y" values="-46;280" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
